[project]
name = "libitrack"
version = "0.1.0"
description = "Libi local Python tracking engine (TransNetV2 shot detection + YOLOE detection + BoxMOT BoT-SORT/ReID + VitTrack SOT fallback), uv-managed ONNX sidecar."
requires-python = ">=3.11"

# Exact == pins resolved by the Task 0 spike against Python 3.11.14 / uv 0.10.4
# on macOS arm64. torch is a TRANSITIVE dependency of boxmot 19 and is
# CPU-only here (torch.cuda.is_available() == False, torch.version.cuda == None);
# this is ACCEPTED per the relaxed footprint constraint. Do not contort to drop it.
#
# IMPORTANT (recorded in SPIKE-NOTES.md): installing boxmot[onnx] DOWNGRADES
# onnxruntime 1.26.0 -> 1.24.3 and adds onnx/onnxslim/onnxscript. The pins
# below reflect the post-boxmot[onnx] resolved set so the runtime matches the
# env the model artifacts were produced/verified in.
dependencies = [
    "boxmot==19.0.0",
    "boxmot[onnx]==19.0.0",
    "onnxruntime==1.24.3",
    "onnx==1.20.1",
    "onnxslim==0.1.93",
    "onnxscript==0.7.0",
    "opencv-python-headless==4.13.0.92",
    "numpy==2.4.5",
    "scipy==1.17.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "filterpy==1.4.5",
    "lapx==0.9.4",
    "scikit-learn==1.8.0",
    "gdown==5.2.2",
    "pytest==9.0.3",
    "ultralytics==8.4.51",
    # MatAnyone (method:"matte" mask-guided video matting). No PyPI dist —
    # pinned to an exact commit via [tool.uv.sources] below. Upstream's
    # pyproject bundles its gradio demo + training deps; only the inference
    # chain (torch/torchvision/omegaconf/imageio/PIL/tqdm/huggingface_hub/
    # safetensors/cv2) is used here, so the demo-only packages are excluded
    # via [tool.uv] override-dependencies below.
    "matanyone",
]

[tool.uv.sources]
matanyone = { git = "https://github.com/pq-yang/MatAnyone", rev = "e5ddc534c1fff9bb9e54cf476095d29071b7cb4f" }
# thinplate is a git direct-reference in matanyone's deps (training-only for
# us, but it has NO registry dist so the impossible-marker override can't
# neutralize it — uv still needs a resolvable source). It's a tiny pure-python
# lib; cheapest correct move is to pin and install it.
thinplate = { git = "https://github.com/cheind/py-thin-plate-spline", rev = "f6995795397118b7d0ac01aecd3f39ffbfad9dee" }

[tool.uv]
# matanyone's upstream dependency list includes gradio-demo / training-only
# packages that are heavy or broken on py3.11 (cchardet fails to build:
# missing longintrepr.h). None are imported by the inference chain
# (matanyone.model.matanyone + matanyone.inference.inference_core — verified
# by import audit of the pinned commit). The impossible marker excludes them.
override-dependencies = [
    "cchardet ; sys_platform == 'never'",        # broken build on py>=3.11
    "gradio ; sys_platform == 'never'",          # demo GUI only
    "pyside6 ; sys_platform == 'never'",         # demo GUI only
    "pyqtdarktheme ; sys_platform == 'never'",   # demo GUI only
    "netifaces ; sys_platform == 'never'",       # demo GUI only
    "hickle ; sys_platform == 'never'",          # training data only
    "tensorboard ; sys_platform == 'never'",     # training logger only
    "pycocotools ; sys_platform == 'never'",     # training data only
    "easing-functions ; sys_platform == 'never'",# demo visualizer only
    "av ; sys_platform == 'never'",              # demo video IO only
    # cv2 is provided by opencv-python-headless (pinned above); installing
    # the non-headless wheel alongside it clobbers the same import path.
    "opencv-python ; sys_platform == 'never'",
]

# NOT runtime dependencies -- only needed to (re)produce the YOLOE ONNX at
# build time. Documented in SPIKE-NOTES.md '## YOLOE acquisition'. Kept out
# of [project.dependencies]:
#   clip @ git+https://github.com/ultralytics/CLIP.git@81ff68ed7ffcac3b40484c914f104f816757308d
#   (+ a 572MB mobileclip_blt.ts download, export-time only)
# Note: ultralytics==8.4.51 is a RUNTIME dependency (used by the eager
# YOLOE-VP detector backend) and is listed in [project.dependencies] above.
#
# shot-detection==0.1.1 is also build-only: it is used solely to resolve the
# TransNetV2 ONNX download URL during artifact provisioning, not at runtime.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libitrack"]
