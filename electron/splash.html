<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>libi</title>
  <style>
    :root {
      --bg:           #09090b;   /* zinc 950 — matches editor background  */
      --fg:           #e4e4e7;   /* zinc 200                              */
      --muted:        #71717a;   /* zinc 500                              */
      --border:       #27272a;   /* zinc 800                              */
      --accent:       #34d399;   /* emerald 400                           */
      --warn:         #fbbf24;   /* amber 400                             */
      --danger:       #f87171;   /* red 400                               */
      --brand:        #d4d4d8;   /* zinc 300 — wordmark                   */
      --primary:      #a78bfa;   /* violet 400 — logo accent              */
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 13px -apple-system, system-ui, "SF Pro Text", sans-serif;
      -webkit-user-select: none;
      -webkit-app-region: drag;   /* whole splash is draggable */
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px 28px;
      gap: 24px;
    }

    /* ───────────── Brand header ───────────── */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mark {
      width: 40px;
      height: 40px;
      color: var(--primary);
      animation: mark-pulse 2.4s ease-in-out infinite;
    }
    @keyframes mark-pulse {
      0%, 100% { transform: scale(1);   opacity: 1;   }
      50%      { transform: scale(1.04); opacity: 0.86; }
    }
    .wordmark {
      font-family: "New York", "Iowan Old Style", Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .tagline {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
      text-align: center;
      max-width: 360px;
    }
    .tagline strong {
      color: var(--fg);
      font-weight: 500;
    }

    /* ───────────── Progress strip ───────────── */
    .strip {
      width: 100%;
      max-width: 440px;
      height: 2px;
      background: var(--border);
      overflow: hidden;
      border-radius: 2px;
      position: relative;
    }
    .strip::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent,
        var(--primary) 50%,
        transparent);
      animation: strip-sweep 1.6s ease-in-out infinite;
    }
    @keyframes strip-sweep {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    body.is-done .strip::after { animation: none; opacity: 0; }
    body.is-failed .strip::after {
      animation: none;
      left: 0;
      width: 100%;
      background: var(--danger);
    }

    /* ───────────── Sections + items ───────────── */
    .card {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .section { display: flex; flex-direction: column; gap: 6px; }
    .section-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .items { display: flex; flex-direction: column; gap: 2px; }
    .item {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
      color: var(--muted);
      min-height: 24px;
    }
    .item.running { color: var(--fg); }
    .item.done    { color: var(--fg); }
    .item.failed  { color: var(--danger); }

    /* Status indicator (16x16 grid cell) */
    .dot { width: 14px; height: 14px; display: grid; place-items: center; }
    .item.pending .dot::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
    }
    .item.running .dot {
      background: transparent;
    }
    .item.running .dot::before {
      content: "";
      width: 12px; height: 12px;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .item.done .dot::before {
      content: "";
      width: 12px; height: 6px;
      border-left: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(-45deg) translate(1px, -1px);
    }
    .item.failed .dot::before {
      content: "✕";
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }
    .item.skipped .dot::before {
      content: "";
      width: 12px; height: 2px;
      background: var(--muted);
      border-radius: 1px;
    }

    .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .item.done .meta    { color: color-mix(in srgb, var(--accent) 60%, var(--muted)); }
    .item.running .meta { color: var(--primary); }

    /* ───────────── Error pane ───────────── */
    .error {
      width: 100%;
      max-width: 440px;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border-radius: 8px;
      color: var(--danger);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .quit-button {
      -webkit-app-region: no-drag;
      margin-top: 4px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--danger) 18%, transparent);
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .quit-button:hover {
      background: color-mix(in srgb, var(--danger) 28%, transparent);
    }

    /* ───────────── Footer ───────────── */
    .footer {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: auto;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="12" cy="16" r="8" stroke="currentColor" stroke-width="2.5" />
      <circle cx="20" cy="16" r="3.6" fill="currentColor" />
    </svg>
    <span class="wordmark">libi</span>
  </div>

  <div class="tagline" id="tagline">
    <strong id="title">Setting up your studio</strong><br/>
    <span id="subtitle">Installing the bundled tools libi needs to run.</span>
  </div>

  <div class="strip" aria-hidden="true"></div>

  <div class="card">
    <div class="section">
      <div class="section-title">Install</div>
      <div class="items" id="installs"></div>
    </div>
    <div class="section">
      <div class="section-title">Verify</div>
      <div class="items" id="probes"></div>
    </div>
    <div class="section">
      <div class="section-title">Boot</div>
      <div class="items" id="boot"></div>
    </div>
  </div>

  <div id="error" class="error" hidden></div>
  <button id="quit" class="quit-button" hidden>Quit libi</button>

  <div class="footer">libi · AI Video Studio</div>

  <script>
    // RC-G: the splash runs isolated/sandboxed with no direct electron access.
    // `window.splashAPI` is bridged in by electron/splash-preload.ts.
    const splashAPI = window.splashAPI;

    function fmtBytes(b) {
      if (!b) return "";
      if (b > 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + " MB";
      if (b > 1024) return (b / 1024).toFixed(1) + " KB";
      return b + " B";
    }

    function upsertItem(parentId, key, label, state, meta) {
      const parent = document.getElementById(parentId);
      let el = parent.querySelector(`[data-key="${key}"]`);
      if (!el) {
        el = document.createElement("div");
        el.className = "item";
        el.dataset.key = key;
        el.innerHTML = `<span class="dot"></span><span class="label"></span><span class="meta"></span>`;
        parent.appendChild(el);
      }
      el.className = "item " + state;
      el.querySelector(".label").textContent = label;
      el.querySelector(".meta").textContent = meta || "";
    }

    function setSubtitle(text) {
      const el = document.getElementById("subtitle");
      if (el && text) el.textContent = text;
    }

    splashAPI.onLifecycle((e) => {
      if (e.kind === "category-a-install-start") {
        upsertItem("installs", "i:" + e.item.id, e.item.label, "running", "downloading…");
        setSubtitle("Installing " + e.item.label + "…");
      } else if (e.kind === "category-a-install-progress") {
        // `detail` wins when set — it carries progress for installs libi
        // can't count bytes for (npm), whose byte fields are 0/null and would
        // otherwise render a motionless "0 B" that reads as a hang.
        if (e.detail) {
          upsertItem("installs", "i:" + e.item.id, e.item.label, "running", e.detail);
          setSubtitle(e.item.label + " — " + e.detail);
        } else {
          const total = e.bytesTotal ? " / " + fmtBytes(e.bytesTotal) : "";
          upsertItem("installs", "i:" + e.item.id, e.item.label, "running",
            fmtBytes(e.bytesDownloaded) + total);
        }
      } else if (e.kind === "category-a-install-done") {
        const state = e.result === "skipped" ? "skipped"
                    : e.result === "failed" ? "failed"
                    : "done";
        upsertItem("installs", "i:" + e.item.id, e.item.label, state,
          e.result === "skipped" ? (e.reason || "already installed")
          : e.result === "failed" ? (e.reason || "install failed")
          : "ready");
      } else if (e.kind === "category-a-probe-start") {
        upsertItem("probes", "p:" + e.mcpId, e.label, "running", "probing…");
        setSubtitle("Verifying " + e.label + "…");
      } else if (e.kind === "category-a-probe-done") {
        const state = e.status === "down" ? "failed"
                    : e.status === "skipped" ? "skipped"
                    : "done";
        upsertItem("probes", "p:" + e.mcpId, e.label, state,
          e.status === "skipped" ? (e.reason || "skipped")
          : e.durationMs != null ? e.durationMs + "ms" : "");
      } else if (e.kind === "category-b-step") {
        upsertItem("boot", "b:" + e.step, e.step, e.status, "");
        if (e.status === "running") setSubtitle("Starting libi…");
      } else if (e.kind === "fatal") {
        document.body.classList.add("is-failed");
        document.getElementById("title").textContent = "Something went wrong";
        setSubtitle("libi couldn't finish setting up.");
        document.getElementById("error").hidden = false;
        document.getElementById("error").textContent =
          `${e.phase}${e.step ? " / " + e.step : ""}: ${e.error}\n\n${e.hint}`;
        document.getElementById("quit").hidden = false;
      }
    });

    document.getElementById("quit").addEventListener("click", () => {
      splashAPI.quit();
    });
  </script>
</body>
</html>
