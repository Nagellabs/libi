name: License check

# libi ships under GPL-3.0-only. This gate fails the build if any production
# dependency arrives under a license that cannot be combined into a GPL work
# (SSPL, BUSL, Elastic-2.0, FSL, Commons-Clause, CC-BY-NC, proprietary…).
#
# The allowlist and the two documented exceptions live in scripts/check-licenses.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  licenses:
    name: GPL-compatibility of production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: we only need the dependency tree and its metadata,
      # not native builds (which are slow and can fail on CI runners).
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Check licenses
        run: bash scripts/check-licenses.sh

      # THIRD-PARTY-NOTICES.md records the sha256 of the package-lock it was
      # generated from, and `prebuild:electron` refuses to build when the two
      # disagree. Nothing ever checked that here, and it cost a silent break:
      # the 0.1.1 version bump moved the lockfile hash, `release:npm` does not
      # run `prebuild:electron` (only `build:electron` does), and no test
      # references the file — so `npm run build:electron` was broken on every
      # platform for a day and would have failed the next Electron release at
      # its first gate. Found by a QA rig, which is far too late for something
      # a five-second check catches.
      #
      # --check is offline and writes nothing; it only compares the hash.
      - name: Check third-party notices are current
        run: npm run notices:check

      - name: Generate SBOM
        if: always()
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file libi-sbom.json || true

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libi-sbom
          path: libi-sbom.json
          if-no-files-found: ignore
