name: Tests

# Until 2026-08-14 nothing in CI ran the suite — `license-check.yml` was the only
# workflow. Two defects survived on exactly that gap, both found by hand during
# the first public release:
#
#   * `runtime-bundle-stamp.test.ts` read the real repo to decide its assertion,
#     so it passed only on a machine that happened to have run a build. On a
#     fresh clone — which is what this workflow is — it always failed.
#   * an integration test cut a `git worktree` from the checkout itself, so every
#     `npm test` rewrote a TRACKED file with absolute machine paths and hid the
#     change behind git's skip-worktree bit.
#
# Both are fixed. This exists so the next one is caught by a machine that has
# never built anything, rather than by someone reading a release log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + integration
    runs-on: ubuntu-latest
    # A hung test otherwise burns the job's full 6-hour default. The first run
    # of this workflow (2026-08-14) hung in `fake-elevenlabs/recorder.test.ts`
    # and had to be cancelled by hand after 19 minutes — and because the run
    # never reached vitest's summary, the failure details for the OTHER files
    # that failed were never printed either. Fail fast, keep the log.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `electron-builder install-app-deps`, which rebuilds
      # better-sqlite3 against ELECTRON's ABI — the exact state that SIGKILLs
      # vitest workers (AGENTS.md → Testing). `pretest` repairs it via
      # ensure-native-modules.js, so let the install skip scripts and leave the
      # native module to that.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # better-sqlite3 ships no prebuild for every runner/Node pairing, and
      # `npm ci --ignore-scripts` leaves it unbuilt regardless. Build it for the
      # ABI this job actually runs.
      - name: Build better-sqlite3 for this Node
        run: npm rebuild better-sqlite3

      - name: Lint
        run: npm run lint

      # TEMPORARY (2026-08-14): the first CI run found the fake-elevenlabs
      # suites failing and hanging on Linux, and the hang meant vitest never
      # printed WHY the others failed. Running just that directory first, with
      # its own timeout, produces a complete, readable failure block instead of
      # a truncated log. Delete this step once those suites are green.
      - name: Diagnose fake-elevenlabs (Linux-only failures under investigation)
        timeout-minutes: 4
        continue-on-error: true
        run: npx vitest run __tests__/unit/fake-elevenlabs --reporter=verbose

      # Fixture-dependent suites (tracking footage, MediaPipe models, Playwright
      # browsers) skip loudly when their inputs are absent — see
      # __tests__/integration/tracking/fixture-guard.ts. A rising SKIP count here
      # is expected; a rising FAIL count is not.
      # Bounded workers and explicit timeouts, because this suite had never run
      # anywhere but an 18-core/48GB workstation. The runner is 4 cores; 1203
      # files across an unbounded pool starved it, and vitest's DEFAULTS
      # (testTimeout 5s, hookTimeout 10s) are calibrated for a machine that
      # fast. Fourteen test files spawn external binaries — ffmpeg among them —
      # and those are the ones that failed.
      #
      # Note the defaults are also why the first run hung rather than failed: a
      # 5s test timeout never fired, which means nothing was stuck INSIDE a test
      # or hook. That points at a starved or dead worker whose file could never
      # report, not at a slow assertion.
      - name: Test
        run: npm test -- --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000

      # The suite must not mutate the checkout. This is the CI half of the
      # regression guard inside worktree-bootstrap-cli.test.ts: that test asserts
      # its own isolation, this catches any OTHER test that starts writing to the
      # repo — including changes hidden by skip-worktree, which `git status`
      # cannot see.
      - name: Assert the suite left the checkout clean
        run: |
          dirty="$(git status --porcelain)"
          flags="$(git ls-files -v | grep -v '^H ' || true)"
          if [ -n "$dirty" ] || [ -n "$flags" ]; then
            echo "::error::the test suite modified the working tree or the index"
            [ -n "$dirty" ] && { echo "--- git status ---"; echo "$dirty"; }
            [ -n "$flags" ] && { echo "--- non-H index flags (skip-worktree/assume-unchanged) ---"; echo "$flags"; }
            git diff -- . | head -100
            exit 1
          fi
          echo "checkout clean, no index flags set"
