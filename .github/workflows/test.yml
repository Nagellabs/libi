name: Tests

# Until 2026-08-14 nothing in CI ran the suite — `license-check.yml` was the only
# workflow. Two defects survived on exactly that gap, both found by hand during
# the first public release:
#
#   * `runtime-bundle-stamp.test.ts` read the real repo to decide its assertion,
#     so it passed only on a machine that happened to have run a build. On a
#     fresh clone — which is what this workflow is — it always failed.
#   * an integration test cut a `git worktree` from the checkout itself, so every
#     `npm test` rewrote a TRACKED file with absolute machine paths and hid the
#     change behind git's skip-worktree bit.
#
# Both are fixed. This exists so the next one is caught by a machine that has
# never built anything, rather than by someone reading a release log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + integration
    runs-on: ubuntu-latest
    # A hung test otherwise burns the job's full 6-hour default. The first run
    # of this workflow (2026-08-14) hung in `fake-elevenlabs/recorder.test.ts`
    # and had to be cancelled by hand after 19 minutes — and because the run
    # never reached vitest's summary, the failure details for the OTHER files
    # that failed were never printed either. Fail fast, keep the log.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `electron-builder install-app-deps`, which rebuilds
      # better-sqlite3 against ELECTRON's ABI — the exact state that SIGKILLs
      # vitest workers (AGENTS.md → Testing). `pretest` repairs it via
      # ensure-native-modules.js, so let the install skip scripts and leave the
      # native module to that.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # better-sqlite3 ships no prebuild for every runner/Node pairing, and
      # `npm ci --ignore-scripts` leaves it unbuilt regardless. node-pty is in
      # the same boat: its install script is what compiles pty.node, so with
      # scripts skipped the ws-origin/ws-port suites fail to even load
      # ("Failed to load native module: pty.node"). Build both for the ABI
      # this job actually runs.
      - name: Build native modules for this Node
        run: npm rebuild better-sqlite3 node-pty

      - name: Lint
        run: npm run lint

      # The ubuntu-latest image ships WITHOUT ffmpeg (`/bin/sh: 1: ffmpeg: not
      # found` in run 31818058607). In production, Category A install puts
      # ffmpeg in `~/.libi/bin`; tests point LIBI_HOME at empty temp dirs, so
      # `resolveBin` (lib/ffmpeg/exec.ts) falls back to `ffmpeg` on PATH —
      # present on every dev macOS, absent here. That absence, not cross-file
      # pollution, is what failed the 6 fake-elevenlabs tests that spawn real
      # ffmpeg (writeAudioPlaceholder).
      #
      # It cost a day to find, for a reason worth remembering: a temporary
      # diagnostic step ran that directory in isolation and carried
      # `continue-on-error: true`, so the STEP reported success while the
      # command inside it failed with these very errors. Reading the step's
      # conclusion instead of its output turned "ffmpeg is missing" into a
      # hunt for cross-file pollution that did not exist. Read the log.
      #
      # Every real-ffmpeg test also carries a hasFfmpeg() skip guard
      # (__tests__/helpers/media.ts), so a clone without ffmpeg skips loudly
      # instead of erroring. Do NOT remove this install on the theory that the
      # guard covers it: without ffmpeg here those tests would silently SKIP in
      # CI and their coverage would be gone. Guard = correct everywhere;
      # install = the tests actually run where it matters.
      - name: Install ffmpeg (not in the runner image; real-ffmpeg tests must run here, not skip)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Fixture-dependent suites (tracking footage, MediaPipe models, Playwright
      # browsers) skip loudly when their inputs are absent — see
      # __tests__/integration/tracking/fixture-guard.ts. A rising SKIP count here
      # is expected; a rising FAIL count is not.
      # Ran once with --maxWorkers=2 and 30s timeouts to test whether the
      # runner's 4 cores were starving the suite. They are not: the same tests
      # failed, in 96ms / 8ms / 7ms / 4ms. Deterministic assertion failures, not
      # timeouts — and the constrained run cost 10+ extra minutes for nothing.
      # Reverted. The real signal from that run was the runner reaping ORPHAN
      # `sh` and `node` processes at the end, which fits a worker held open by a
      # live child and explains why no test-level timeout ever fired.
      - name: Test
        run: npm test

      # The suite must not mutate the checkout. This is the CI half of the
      # regression guard inside worktree-bootstrap-cli.test.ts: that test asserts
      # its own isolation, this catches any OTHER test that starts writing to the
      # repo — including changes hidden by skip-worktree, which `git status`
      # cannot see.
      - name: Assert the suite left the checkout clean
        run: |
          dirty="$(git status --porcelain)"
          flags="$(git ls-files -v | grep -v '^H ' || true)"
          if [ -n "$dirty" ] || [ -n "$flags" ]; then
            echo "::error::the test suite modified the working tree or the index"
            [ -n "$dirty" ] && { echo "--- git status ---"; echo "$dirty"; }
            [ -n "$flags" ] && { echo "--- non-H index flags (skip-worktree/assume-unchanged) ---"; echo "$flags"; }
            git diff -- . | head -100
            exit 1
          fi
          echo "checkout clean, no index flags set"
