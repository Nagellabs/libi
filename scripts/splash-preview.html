<!doctype html>
<!--
  Standalone preview of the Electron splash for visual review.
  Drives fake lifecycle events on a timer. Open in a browser to
  see exactly what the .app's splash shows during Category A + B.

  Source of truth is electron/splash.html. If you change styling
  here, mirror it there (or vice-versa).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>libi splash · preview</title>
  <style>
    :root {
      --bg:           #09090b;
      --fg:           #e4e4e7;
      --muted:        #71717a;
      --border:       #27272a;
      --accent:       #34d399;
      --warn:         #fbbf24;
      --danger:       #f87171;
      --brand:        #d4d4d8;
      --primary:      #a78bfa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--fg);
      font: 13px -apple-system, system-ui, "SF Pro Text", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .frame {
      width: 560px;
      height: 640px;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px #18181b inset;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px 28px;
      gap: 24px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mark {
      width: 40px;
      height: 40px;
      color: var(--primary);
      animation: mark-pulse 2.4s ease-in-out infinite;
    }
    @keyframes mark-pulse {
      0%, 100% { transform: scale(1);   opacity: 1;   }
      50%      { transform: scale(1.04); opacity: 0.86; }
    }
    .wordmark {
      font-family: "New York", "Iowan Old Style", Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .tagline {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
      text-align: center;
      max-width: 360px;
    }
    .tagline strong {
      color: var(--fg);
      font-weight: 500;
    }
    .strip {
      width: 100%;
      max-width: 440px;
      height: 2px;
      background: var(--border);
      overflow: hidden;
      border-radius: 2px;
      position: relative;
    }
    .strip::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--primary) 50%, transparent);
      animation: strip-sweep 1.6s ease-in-out infinite;
    }
    @keyframes strip-sweep {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    .frame.is-done .strip::after { animation: none; opacity: 0; }
    .frame.is-failed .strip::after { animation: none; left: 0; width: 100%; background: var(--danger); }

    .card { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
    .section { display: flex; flex-direction: column; gap: 6px; }
    .section-title {
      font-size: 10px; letter-spacing: 0.12em; color: var(--muted);
      text-transform: uppercase; font-weight: 600;
    }
    .items { display: flex; flex-direction: column; gap: 2px; }
    .item {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
      color: var(--muted);
      min-height: 24px;
    }
    .item.running { color: var(--fg); }
    .item.done    { color: var(--fg); }
    .item.failed  { color: var(--danger); }

    .dot { width: 14px; height: 14px; display: grid; place-items: center; }
    .item.pending .dot::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--border);
    }
    .item.running .dot::before {
      content: "";
      width: 12px; height: 12px;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .item.done .dot::before {
      content: "";
      width: 12px; height: 6px;
      border-left: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(-45deg) translate(1px, -1px);
    }
    .item.failed .dot::before {
      content: "✕"; color: var(--danger); font-size: 13px; font-weight: 600; line-height: 1;
    }
    .item.skipped .dot::before {
      content: ""; width: 12px; height: 2px; background: var(--muted); border-radius: 1px;
    }

    .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    .item.done .meta    { color: color-mix(in srgb, var(--accent) 60%, var(--muted)); }
    .item.running .meta { color: var(--primary); }

    .error {
      width: 100%; max-width: 440px;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border-radius: 8px;
      color: var(--danger);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; line-height: 1.6; white-space: pre-wrap;
    }
    .quit-button {
      margin-top: 4px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--danger) 18%, transparent);
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
      border-radius: 6px;
      font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer;
    }

    .footer {
      color: var(--muted);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      margin-top: auto; opacity: 0.7;
    }

    .controls {
      position: fixed; top: 16px; right: 16px;
      display: flex; gap: 8px;
      font: 12px -apple-system, system-ui, sans-serif;
      z-index: 10;
    }
    .controls button {
      padding: 6px 12px;
      background: #18181b; color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls button:hover { background: #27272a; }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="runHappyPath()">▶ Happy path</button>
    <button onclick="runFailurePath()">⚠ Failure path</button>
    <button onclick="resetAll()">↻ Reset</button>
  </div>

  <div class="frame" id="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="12" cy="16" r="8" stroke="currentColor" stroke-width="2.5" />
        <circle cx="20" cy="16" r="3.6" fill="currentColor" />
      </svg>
      <span class="wordmark">libi</span>
    </div>

    <div class="tagline">
      <strong id="title">Setting up your studio</strong><br/>
      <span id="subtitle">Launching the bundled tools libi needs to run.</span>
    </div>

    <div class="strip" aria-hidden="true"></div>

    <div class="card">
      <div class="section">
        <div class="section-title">Install</div>
        <div class="items" id="installs"></div>
      </div>
      <div class="section">
        <div class="section-title">Verify</div>
        <div class="items" id="probes"></div>
      </div>
      <div class="section">
        <div class="section-title">Boot</div>
        <div class="items" id="boot"></div>
      </div>
    </div>

    <div id="error" class="error" hidden></div>
    <button id="quit" class="quit-button" hidden>Quit libi</button>

    <div class="footer">libi · AI Video Studio</div>
  </div>

  <script>
    function fmtBytes(b) {
      if (!b) return "";
      if (b > 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + " MB";
      if (b > 1024) return (b / 1024).toFixed(1) + " KB";
      return b + " B";
    }

    function upsertItem(parentId, key, label, state, meta) {
      const parent = document.getElementById(parentId);
      let el = parent.querySelector(`[data-key="${key}"]`);
      if (!el) {
        el = document.createElement("div");
        el.className = "item";
        el.dataset.key = key;
        el.innerHTML = `<span class="dot"></span><span class="label"></span><span class="meta"></span>`;
        parent.appendChild(el);
      }
      el.className = "item " + state;
      el.querySelector(".label").textContent = label;
      el.querySelector(".meta").textContent = meta || "";
    }

    function setSubtitle(text) {
      const el = document.getElementById("subtitle");
      if (el && text) el.textContent = text;
    }

    function handleLifecycle(e) {
      if (e.kind === "category-a-install-start") {
        upsertItem("installs", "i:" + e.item.id, e.item.label, "running", "downloading…");
        setSubtitle("Installing " + e.item.label + "…");
      } else if (e.kind === "category-a-install-progress") {
        const total = e.bytesTotal ? " / " + fmtBytes(e.bytesTotal) : "";
        upsertItem("installs", "i:" + e.item.id, e.item.label, "running",
          fmtBytes(e.bytesDownloaded) + total);
      } else if (e.kind === "category-a-install-done") {
        const state = e.result === "skipped" ? "skipped" : "done";
        upsertItem("installs", "i:" + e.item.id, e.item.label, state,
          e.result === "skipped" ? (e.reason || "already installed") : "ready");
      } else if (e.kind === "category-a-probe-start") {
        upsertItem("probes", "p:" + e.mcpId, e.label, "running", "probing…");
        setSubtitle("Verifying " + e.label + "…");
      } else if (e.kind === "category-a-probe-done") {
        const state = e.status === "down" ? "failed"
                    : e.status === "skipped" ? "skipped"
                    : "done";
        upsertItem("probes", "p:" + e.mcpId, e.label, state,
          e.status === "skipped" ? (e.reason || "skipped")
          : e.durationMs != null ? e.durationMs + "ms" : "");
      } else if (e.kind === "category-b-step") {
        upsertItem("boot", "b:" + e.step, e.step, e.status, "");
        if (e.status === "running") setSubtitle("Starting libi…");
      } else if (e.kind === "fatal") {
        document.getElementById("frame").classList.add("is-failed");
        document.getElementById("title").textContent = "Something went wrong";
        setSubtitle("libi couldn't finish setting up.");
        document.getElementById("error").hidden = false;
        document.getElementById("error").textContent =
          `${e.phase}${e.step ? " / " + e.step : ""}: ${e.error}\n\n${e.hint}`;
        document.getElementById("quit").hidden = false;
      }
    }

    function resetAll() {
      ["installs", "probes", "boot"].forEach((id) => document.getElementById(id).innerHTML = "");
      document.getElementById("error").hidden = true;
      document.getElementById("quit").hidden = true;
      document.getElementById("title").textContent = "Setting up your studio";
      document.getElementById("subtitle").textContent = "Launching the bundled tools libi needs to run.";
      document.getElementById("frame").classList.remove("is-failed", "is-done");
    }

    async function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    async function runHappyPath() {
      resetAll();
      const items = [
        { id: "chromium",   label: "Playwright Chromium", sizeMB: 165, ms: 1500 },
        { id: "ffmpeg",     label: "ffmpeg",              sizeMB: 80,  ms: 1000 },
        { id: "ffprobe",    label: "ffprobe",             sizeMB: 80,  ms: 1000 },
        { id: "uv",         label: "uv",                  sizeMB: 12,  ms: 500 },
        { id: "yt-dlp",     label: "yt-dlp",              sizeMB: 6,   ms: 500 },
      ];

      for (const it of items) {
        handleLifecycle({ kind: "category-a-install-start", item: { id: it.id, label: it.label, kind: "binary" } });
        const total = it.sizeMB * 1024 * 1024;
        const steps = 5;
        for (let i = 1; i <= steps; i++) {
          await sleep(it.ms / steps);
          handleLifecycle({
            kind: "category-a-install-progress",
            item: { id: it.id, label: it.label, kind: "binary" },
            bytesDownloaded: Math.floor((total * i) / steps),
            bytesTotal: total,
          });
        }
        handleLifecycle({ kind: "category-a-install-done", item: { id: it.id, label: it.label, kind: "binary" }, result: "installed" });
      }

      const probes = [
        { id: "youtube-downloader", label: "YouTube Downloader", ms: 320 },
        { id: "fake-ai-assets",     label: "fake-ai-assets",     ms: 180 },
        { id: "fal-ai",             label: "fal.ai",             skipped: true, reason: "needs config" },
      ];

      for (const p of probes) {
        if (p.skipped) {
          handleLifecycle({ kind: "category-a-probe-done", mcpId: p.id, label: p.label, status: "skipped", reason: p.reason });
        } else {
          handleLifecycle({ kind: "category-a-probe-start", mcpId: p.id, label: p.label });
          await sleep(p.ms);
          handleLifecycle({ kind: "category-a-probe-done", mcpId: p.id, label: p.label, status: "up", durationMs: p.ms });
        }
      }

      const bootSteps = ["db-migrate", "jobs-recover", "agent-warm", "workspace-prep", "standby-session"];
      for (const s of bootSteps) {
        handleLifecycle({ kind: "category-b-step", step: s, status: "running" });
        await sleep(180);
        handleLifecycle({ kind: "category-b-step", step: s, status: "done" });
      }

      document.getElementById("frame").classList.add("is-done");
      setSubtitle("Ready");
    }

    async function runFailurePath() {
      resetAll();
      handleLifecycle({ kind: "category-a-install-start", item: { id: "chromium", label: "Playwright Chromium", kind: "binary" } });
      await sleep(600);
      handleLifecycle({
        kind: "category-a-install-progress",
        item: { id: "chromium", label: "Playwright Chromium", kind: "binary" },
        bytesDownloaded: 40 * 1024 * 1024,
        bytesTotal: 165 * 1024 * 1024,
      });
      await sleep(500);
      handleLifecycle({
        kind: "fatal",
        phase: "category-a",
        step: "binary-install",
        error: "Failed to install Playwright Chromium: network timed out after 60s",
        hint: "Check your network connection and try again. If the problem persists, the download URL may be temporarily unreachable.",
      });
    }

    runHappyPath();
  </script>
</body>
</html>
